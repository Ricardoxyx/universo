
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universo da Taís</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
      color: white;
    }

    .lua {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 60px;
      color: #f0f8ff;
      text-shadow: 0 0 10px #fff, 0 0 30px #8ec5fc;
      z-index: 2;
    }

    .mensagem {
      position: absolute;
      bottom: 60px;
      width: 100%;
      text-align: center;
      font-size: 24px;
      color: #ffffff;
      text-shadow: 0 0 10px #fff, 0 0 20px #8ec5fc;
      z-index: 2;
    }

    .estrela {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      opacity: 0;
      animation: brilhar 3s ease-in-out forwards;
    }

    @keyframes brilhar {
      0% { opacity: 0; transform: scale(0.5); }
      50% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0.8; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="lua">🌙</div>
  <div class="mensagem">Feliz Aniversário Taís</div>

  <script>
    function criarEstrela() {
      const estrela = document.createElement('div');
      estrela.className = 'estrela';
      estrela.style.top = Math.random() * 100 + 'vh';
      estrela.style.left = Math.random() * 100 + 'vw';
      estrela.style.animationDelay = Math.random() * 5 + 's';
      estrela.style.animationDuration = 2 + Math.random() * 4 + 's';
      document.body.appendChild(estrela);

      setTimeout(() => {
        estrela.remove();
      }, 8000);
    }

    setInterval(() => {
      for (let i = 0; i < 5; i++) {
        criarEstrela();
      }
    }, 500);
  </script>
</body>
</html>
